<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambro461</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, Segoe UI, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
    min-height: 100vh;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 80px 24px;
}

.hero {
    text-align: center;
    margin-bottom: 60px;
}

.hero h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    margin-bottom: 12px;
}

.hero p {
    color: var(--muted);
    font-size: 1.1rem;
}

.projects {
    display: grid;
    gap: 24px;
}

.project {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 28px;
    transition: all .2s ease;
    backdrop-filter: blur(10px);
}

.project:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.project-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
}

.project-description {
    color: var(--muted);
    line-height: 1.5;
}

.badge {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(59,130,246,.15);
    color: #93c5fd;
    font-size: .85rem;
}

footer {
    text-align: center;
    margin-top: 60px;
    color: var(--muted);
    font-size: .9rem;
}
</style>
</head>

<body>

<div class="container">

    <section class="hero">
        <h1>Ambro461</h1>
        <p>Zbirka spletnih projektov.</p>
    </section>

    <section class="projects">

        <a class="project" href="zvilca/nastavek-za-zvilco">
            <div class="project-title">
                Nastavek za žvilco
            </div>

            <div class="project-description">
                Informacije, dokumentacija in predstavitev projekta
                za nastavek za žvilco.
            </div>

            <span class="badge">Aktiven projekt</span>
        </a>

    </section>

    <footer>
        © 2026 Ambro461
    </footer>

</div>

</body>
</html>
